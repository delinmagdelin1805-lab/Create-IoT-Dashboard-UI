<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>IoT Dashboard UI</title>

  <link rel="stylesheet"
    href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

  <div class="dashboard">

    <h1>
      IoT Dashboard
    </h1>

    <div class="cards">

      <!-- Card 1 -->

      <div class="card">

        <i class="fa-solid fa-lightbulb"></i>

        <h2>
          Smart Lights
        </h2>

        <p>
          Connected
        </p>

        <button>
          ON
        </button>

      </div>

      <!-- Card 2 -->

      <div class="card">

        <i class="fa-solid fa-temperature-half"></i>

        <h2>
          Temperature
        </h2>

        <p>
          24°C Active
        </p>

        <button>
          View
        </button>

      </div>

      <!-- Card 3 -->

      <div class="card">

        <i class="fa-solid fa-wifi"></i>

        <h2>
          Network
        </h2>

        <p>
          Stable Connection
        </p>

        <button>
          Check
        </button>

      </div>

    </div>

  </div>

</body>

</html>
